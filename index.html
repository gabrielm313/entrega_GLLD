<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tela de início</title>
        <link rel="stylesheet" href="css/reset.css">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header>
            <section class="perfil">
                <a href="menu.html">
                    <img src="img/menu.png" class = 'hamburguer'>
                </a>
                <ul class="user">
                    <li class="hello">Olá, </li>
                    <li class="username">Bruno Menezes</li>
                </ul>
                <img src="img/perfil.png"  alt="Imagem do Usuário" class="img-usuario">
            </section>
        </header>

        <main class="home">
            <section class="estat">
                <a href="metas.html">
                    <ul>
                        <li>Desempenho Semanal</li>
                        <li>Ver Mais</li>
                    </ul>
                    <img src="img/grafico_inicio.png" alt="Imagem estatística mensal" class="grafico-home">
                </a>
            </section>
            
            <ul>
                <li>
                    <a href="scanner.html"  class="scanner"> 
                        <img src="img/qr-code.png" alt="qr-code" class="icone-seta-pin-qrcode">
                        <p>Escanear Pedido</p>
                        <img src="img/seta-direita.png" alt="Botão iniciar" class="img-seta">
                    </a>
                    
                </li>
                <li>
                    <a href="mapa.html" class="iniciar"> 
                        <img src="img/pin.png" alt="pin" class="icone-seta-pin-qrcode">
                        <p>Iniciar Rota</p>
                        <img src="img/seta-direita.png" alt="Botão iniciar" class="img-seta">
                    </a>
                </li>
            </ul>
        </main>
    </body>
</html>
