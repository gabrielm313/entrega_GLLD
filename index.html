<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de início</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="java/java.js"></script>
</head>

<body>

    <header>
        <section class="perfil">

            <a href="#" id="abrir-menu">
                <img src="img/menu.png" class="hamburguer" alt="Menu">
            </a>

            <ul class="user">
                <li class="hello">Olá,</li>
                <li class="username">Bruno Menezes</li>
            </ul>

            <img src="img/perfil.png" alt="Imagem do Usuário" class="img-usuario">

        </section>
    </header>

    <nav id="menu-lateral">
        <button id="fechar-menu" type="button">
            <img src="img/voltar.png" alt="Fechar menu" class="voltar">
        </button>

        <div class="container-casa-menu">
            <a href="index.html" class="link-casa-menu">
                <img src="img/casa.png" alt="Página inicial" class="casinha">
            </a>
        </div>

        <ul>
            <li><a href="perfil.html" class="op-menu">Perfil</a></li>
            <li><a href="metas.html" class="op-menu">Metas</a></li>
            <li><a href="entregas.html" class="op-menu">Entregas</a></li>
            <li><a href="cursos.html" class="op-menu">Cursos</a></li>
            <li><a href="configuracao.html" class="op-menu">Configuração</a></li>
            <li><a href="ajuda.html" class="op-menu">FAQ</a></li>
        </ul>
    </nav>

    <main class="home">

        <section class="estat">
            <a href="metas.html">
                <ul class="info-graf">
                    <li>Desempenho Semanal</li>
                    <li class="ver-mais">Ver Mais</li>
                </ul>

                <img src="img/grafico_inicio.png"
                     alt="Imagem estatística mensal"
                     class="grafico-home">
            </a>
        </section>

        <ul class="botao-index">

            <li>
                <a href="scanner.html" class="scanner">

                    <img src="img/qr-code.png"
                         alt="qr-code"
                         class="icone-seta-pin-qrcode">

                    <p>Escanear Pedido</p>

                    <img src="img/seta-direita.png"
                         alt="Botão iniciar"
                         class="img-seta">

                </a>
            </li>

            <li>
                <a href="mapa.html" class="iniciar">

                    <img src="img/pin.png"
                         alt="pin"
                         class="icone-seta-pin-qrcode">

                    <p>Iniciar Rota</p>

                    <img src="img/seta-direita.png"
                         alt="Botão iniciar"
                         class="img-seta">

                </a>
            </li>

        </ul>

    </main>

</body>
</html>
